name: Publică CRM (GitHub Pages)

# Publică automat CRM-ul Select Academy ca site web, ca să poată fi
# deschis în browser pe telefon și desktop (nu ca fișier de cod).
on:
  push:
    branches: ["claude/select-academy-crm-AAFJq"]
    paths: ["crm/**", ".github/workflows/deploy-crm.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configurează Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Încarcă conținutul CRM
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./crm
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
