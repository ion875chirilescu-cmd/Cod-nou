name: Publică CRM pe GitHub Pages

on:
  push:
    branches: ["claude/crm-multi-branch-loans-a3rjco"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Construiește site-ul
        run: |
          mkdir -p _site
          cp crm.html _site/index.html
          cp crm.html _site/crm.html

      - name: Configurează Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Încarcă artefactul
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Publică pe Pages
        id: deployment
        uses: actions/deploy-pages@v4
