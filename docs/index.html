<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<meta name="theme-color" content="#0E0E10" />
<title>Select Academy — CRM</title>
<style>
/* ============================================================
   SELECT ACADEMY — CRM
   Aplicație într-un singur fișier. Rulează direct în browser.
   Date salvate local (localStorage). Responsive: desktop + mobil.
   Paletă: dark + auriu (brand Select).
   ============================================================ */
:root{
  --bg:#0E0E10; --surface:#17171A; --surface-alt:#1F1F24; --surface-3:#2A2A30;
  --primary:#E8273A; --primary-dark:#C41E2E; --primary-soft:rgba(232,39,58,.15);
  --text:#F5F5F5; --muted:#97979F; --border:#2A2A30;
  --success:#3FB562; --warning:#E0A800; --danger:#E8273A; --info:#4F9DDE;
  --r-sm:8px; --r-md:12px; --r-lg:18px;
  --shadow:0 8px 30px rgba(0,0,0,.4);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  background:var(--bg); color:var(--text); -webkit-font-smoothing:antialiased;
  font-size:15px; line-height:1.45;
}
button{font-family:inherit; cursor:pointer; border:none; background:none; color:inherit}
input,select,textarea{font-family:inherit; font-size:15px}
a{color:var(--primary); text-decoration:none}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--surface-3);border-radius:10px}
::-webkit-scrollbar-track{background:transparent}

/* ---------- Layout ---------- */
.app{display:flex; min-height:100vh}
.sidebar{
  width:236px; background:var(--surface); border-right:1px solid var(--border);
  display:flex; flex-direction:column; position:fixed; top:0; bottom:0; left:0; z-index:40;
}
.brand{padding:22px 18px 18px; border-bottom:1px solid var(--border)}
.wordmark{font-weight:900; font-size:24px; line-height:.92; letter-spacing:-.5px}
.wordmark .sel{color:var(--text); display:block}
.wordmark .aca{color:var(--primary); display:block; font-size:15px; letter-spacing:5.5px; margin-top:3px; margin-left:1px}
.brand .tag{display:block;color:var(--muted);font-weight:600;font-size:10px;letter-spacing:2px;margin-top:9px;text-transform:uppercase}
.nav{flex:1; padding:12px 10px; overflow-y:auto}
.nav button{
  display:flex; align-items:center; gap:12px; width:100%; padding:11px 13px; border-radius:var(--r-md);
  color:var(--muted); font-size:14.5px; font-weight:500; margin-bottom:3px; transition:.15s; text-align:left;
}
.nav button .ic{width:20px;text-align:center;font-size:17px}
.nav button:hover{background:var(--surface-alt); color:var(--text)}
.nav button.active{background:var(--primary-soft); color:var(--primary); font-weight:600}
.nav-footer{padding:12px 14px; border-top:1px solid var(--border); color:var(--muted); font-size:11.5px}

.main{flex:1; margin-left:236px; min-width:0; display:flex; flex-direction:column}
.topbar{
  position:sticky; top:0; z-index:30; background:rgba(15,15,18,.85); backdrop-filter:blur(10px);
  border-bottom:1px solid var(--border); padding:14px 26px;
  display:flex; align-items:center; gap:16px; flex-wrap:wrap;
}
.topbar h1{font-size:20px; font-weight:700; flex:1; min-width:140px}
.content{padding:24px 26px 90px; max-width:1280px; width:100%; margin:0 auto}

/* ---------- Period selector ---------- */
.period{display:flex; align-items:center; gap:8px; flex-wrap:wrap}
.period select,.period input[type=date]{
  background:var(--surface-alt); color:var(--text); border:1px solid var(--border);
  border-radius:var(--r-sm); padding:8px 10px; font-size:13.5px;
}
.period .seg{display:flex; background:var(--surface-alt); border:1px solid var(--border); border-radius:var(--r-sm); overflow:hidden}
.period .seg button{padding:8px 12px; font-size:13px; color:var(--muted); font-weight:600}
.period .seg button.active{background:var(--primary); color:#fff}

/* ---------- Cards / KPIs ---------- */
.grid{display:grid; gap:16px}
.kpis{grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); margin-bottom:18px}
.card{
  background:var(--surface); border:1px solid var(--border); border-radius:var(--r-lg); padding:18px 20px;
}
.kpi{position:relative; overflow:hidden}
.kpi .label{color:var(--muted); font-size:12.5px; font-weight:600; text-transform:uppercase; letter-spacing:.6px}
.kpi .value{font-size:27px; font-weight:800; margin-top:7px; letter-spacing:-.5px}
.kpi .sub{font-size:12.5px; color:var(--muted); margin-top:3px}
.kpi .ic{position:absolute; top:16px; right:18px; font-size:22px; opacity:.85}
.kpi.green .value{color:var(--success)} .kpi.red .value{color:var(--danger)}
.kpi.gold .value{color:var(--primary)} .kpi.blue .value{color:var(--info)}
.kpi.green{background:linear-gradient(160deg,rgba(63,181,98,.12),var(--surface) 62%)}
.kpi.red{background:linear-gradient(160deg,rgba(232,39,58,.12),var(--surface) 62%)}
.kpi.gold{background:linear-gradient(160deg,rgba(232,39,58,.12),var(--surface) 62%)}
.kpi.blue{background:linear-gradient(160deg,rgba(79,157,222,.12),var(--surface) 62%)}

/* ---------- Hero + acțiuni rapide (dashboard) ---------- */
.hero{display:flex; justify-content:space-between; align-items:center; gap:14px; flex-wrap:wrap; margin-bottom:16px}
.hero-hi{font-size:21px; font-weight:800; letter-spacing:-.3px}
.hero-sub{color:var(--muted); font-size:13px; margin-top:2px}
.hero-profit{text-align:right; background:var(--surface); border:1px solid var(--border); border-radius:var(--r-md); padding:9px 16px}
.hero-profit span{display:block; color:var(--muted); font-size:10.5px; text-transform:uppercase; letter-spacing:.6px; font-weight:600}
.hero-profit b{font-size:21px; color:var(--success)} .hero-profit.neg b{color:var(--danger)}
.quick-actions{display:flex; gap:10px; margin-bottom:20px; flex-wrap:wrap}
.quick-actions button{flex:1; min-width:74px; display:flex; flex-direction:column; align-items:center; gap:5px; padding:14px 8px; border-radius:var(--r-md); background:var(--surface); border:1px solid var(--border); color:var(--text); font-size:12.5px; font-weight:600; transition:.15s}
.quick-actions button:hover{border-color:var(--primary); background:var(--surface-alt)}
.quick-actions .qa-ic{font-size:23px; line-height:1}

/* ---------- Buton plutitor (FAB) ---------- */
.fab{position:fixed; right:18px; bottom:84px; z-index:60; width:56px; height:56px; border-radius:50%;
  background:linear-gradient(145deg,var(--primary),var(--primary-dark)); color:#fff; font-size:30px; font-weight:300;
  display:grid; place-items:center; box-shadow:0 8px 22px rgba(232,39,58,.45); transition:.15s}
.fab:hover{filter:brightness(1.08); transform:translateY(-2px)}
.fab.hide{display:none}
@media(min-width:761px){ .fab{bottom:26px; right:26px} }

.section-title{font-size:15px; font-weight:700; margin:24px 0 12px; display:flex; align-items:center; gap:8px}
.row2{grid-template-columns:1.6fr 1fr}
.row1{grid-template-columns:1fr}

/* ---------- Chart ---------- */
.chart-wrap{overflow-x:auto}
.bars{display:flex; align-items:flex-end; gap:10px; height:200px; padding-top:10px; min-width:480px}
.bar-col{flex:1; display:flex; flex-direction:column; align-items:center; gap:6px; min-width:34px}
.bar-stack{display:flex; align-items:flex-end; gap:3px; height:170px; width:100%; justify-content:center}
.bar{width:13px; border-radius:4px 4px 0 0; transition:.3s; min-height:2px}
.bar.inc{background:linear-gradient(180deg,var(--success),#2f7d32)}
.bar.exp{background:linear-gradient(180deg,var(--danger),#9d3a3a)}
.bar-col .lbl{font-size:11px; color:var(--muted); font-weight:600}
.legend{display:flex; gap:18px; margin-top:6px; font-size:12.5px; color:var(--muted); flex-wrap:wrap}
.legend span{display:inline-flex; align-items:center; gap:6px}
.dot{width:10px;height:10px;border-radius:3px;display:inline-block}

/* donut */
.donut-wrap{display:flex; align-items:center; gap:18px; flex-wrap:wrap}
.donut-legend{flex:1; min-width:150px; font-size:13px}
.donut-legend .li{display:flex; align-items:center; gap:8px; justify-content:space-between; padding:5px 0; border-bottom:1px solid var(--border)}
.donut-legend .li:last-child{border-bottom:none}
.donut-legend .li .nm{display:flex;align-items:center;gap:8px}

/* ---------- Tables ---------- */
.toolbar{display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:14px}
.search{
  flex:1; min-width:160px; background:var(--surface-alt); border:1px solid var(--border);
  border-radius:var(--r-sm); padding:9px 12px; color:var(--text);
}
.table-wrap{overflow-x:auto; border:1px solid var(--border); border-radius:var(--r-lg); background:var(--surface)}
table{width:100%; border-collapse:collapse; min-width:560px}
th,td{padding:12px 14px; text-align:left; font-size:13.7px; border-bottom:1px solid var(--border); white-space:nowrap}
th{color:var(--muted); font-weight:600; font-size:11.5px; text-transform:uppercase; letter-spacing:.5px; position:sticky; top:0; background:var(--surface)}
tbody tr:hover{background:var(--surface-alt)}
tbody tr:last-child td{border-bottom:none}
td.num,th.num{text-align:right; font-variant-numeric:tabular-nums}
.row-actions{display:flex; gap:6px; justify-content:flex-end}
.icon-btn{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:var(--muted);font-size:14px}
.icon-btn:hover{background:var(--surface-3); color:var(--text)}
.icon-btn.danger:hover{color:var(--danger)}

.badge{display:inline-block; padding:3px 9px; border-radius:999px; font-size:11.5px; font-weight:700; letter-spacing:.2px}
.b-green{background:rgba(76,175,80,.16);color:#7bd17f}
.b-gold{background:var(--primary-soft);color:var(--primary)}
.b-red{background:rgba(224,85,85,.16);color:#f08a8a}
.b-gray{background:var(--surface-3);color:var(--muted)}
.b-blue{background:rgba(79,157,222,.16);color:#86c1ef}

.empty{text-align:center; padding:46px 20px; color:var(--muted)}
.empty .big{font-size:38px; margin-bottom:10px}

/* ---------- Buttons ---------- */
.btn{
  display:inline-flex; align-items:center; gap:7px; padding:9px 15px; border-radius:var(--r-sm);
  font-weight:600; font-size:13.7px; transition:.15s; white-space:nowrap;
}
.btn-primary{background:linear-gradient(145deg,var(--primary),var(--primary-dark)); color:#fff; box-shadow:0 4px 14px rgba(232,39,58,.28)}
.btn-primary:hover{filter:brightness(1.07)}
.btn-ghost{background:var(--surface-alt); color:var(--text); border:1px solid var(--border)}
.btn-ghost:hover{background:var(--surface-3)}
.btn-danger{background:rgba(224,85,85,.15); color:#f08a8a; border:1px solid rgba(224,85,85,.3)}
.btn-danger:hover{background:rgba(224,85,85,.25)}
.btn-sm{padding:6px 11px; font-size:12.5px}

/* ---------- Modal ---------- */
.overlay{
  position:fixed; inset:0; background:rgba(0,0,0,.6); backdrop-filter:blur(3px);
  display:none; align-items:center; justify-content:center; z-index:100; padding:16px;
}
.overlay.open{display:flex}
.modal{
  background:var(--surface); border:1px solid var(--border); border-radius:var(--r-lg);
  width:100%; max-width:520px; max-height:92vh; overflow-y:auto; box-shadow:var(--shadow);
  animation:pop .18s ease;
}
@keyframes pop{from{transform:translateY(14px) scale(.98);opacity:0}to{transform:none;opacity:1}}
.modal-head{display:flex; align-items:center; justify-content:space-between; padding:18px 20px; border-bottom:1px solid var(--border)}
.modal-head h3{font-size:17px;font-weight:700}
.modal-body{padding:20px}
.modal-foot{padding:16px 20px; border-top:1px solid var(--border); display:flex; gap:10px; justify-content:flex-end}
.field{margin-bottom:14px}
.field label{display:block; font-size:12.5px; color:var(--muted); font-weight:600; margin-bottom:6px}
.field input,.field select,.field textarea{
  width:100%; background:var(--surface-alt); border:1px solid var(--border); color:var(--text);
  border-radius:var(--r-sm); padding:10px 12px;
}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--primary)}
.field textarea{resize:vertical;min-height:64px}
.field-row{display:flex; gap:12px} .field-row .field{flex:1}
.hint{font-size:11.5px;color:var(--muted);margin-top:5px}

/* ---------- Toast ---------- */
.toast{
  position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(20px);
  background:var(--surface-3); color:var(--text); padding:12px 20px; border-radius:var(--r-md);
  border:1px solid var(--border); box-shadow:var(--shadow); z-index:200; opacity:0; transition:.25s;
  font-size:14px; font-weight:600; display:flex; align-items:center; gap:9px; pointer-events:none;
}
.toast.show{opacity:1; transform:translateX(-50%) translateY(0)}
.toast.ok{border-color:var(--success)} .toast.err{border-color:var(--danger)}

/* ---------- Mobile nav ---------- */
.mobile-nav{display:none}
.hamburger{display:none}
.overlay-nav{display:none}

/* progress bar in table */
.pbar{height:6px;background:var(--surface-3);border-radius:6px;overflow:hidden;min-width:70px}
.pbar i{display:block;height:100%;background:linear-gradient(90deg,var(--primary),var(--primary-dark))}

.pill-filter{display:flex;gap:6px;flex-wrap:wrap}
.pill-filter button{padding:6px 12px;border-radius:999px;font-size:12.5px;font-weight:600;background:var(--surface-alt);border:1px solid var(--border);color:var(--muted)}
.pill-filter button.active{background:var(--primary-soft);border-color:var(--primary);color:var(--primary)}

/* ============ RESPONSIVE ============ */
@media(max-width:860px){
  .row2{grid-template-columns:1fr}
}
@media(max-width:760px){
  .sidebar{display:none}
  .main{margin-left:0}
  .hamburger{display:grid; place-items:center; width:40px;height:40px;border-radius:10px;background:var(--surface-alt);border:1px solid var(--border);font-size:18px}
  .topbar{padding:12px 16px}
  .topbar h1{font-size:17px}
  .content{padding:16px 14px 96px}
  /* Bottom tab bar */
  .mobile-nav{
    display:flex; position:fixed; bottom:0; left:0; right:0; z-index:50;
    background:var(--surface); border-top:1px solid var(--border); padding:6px 4px 8px;
    justify-content:space-around;
  }
  .mobile-nav button{flex:1; display:flex; flex-direction:column; align-items:center; gap:3px; color:var(--muted); font-size:10px; font-weight:600; padding:4px 2px}
  .mobile-nav button .ic{font-size:19px}
  .mobile-nav button.active{color:var(--primary)}
  /* Slide-out full menu */
  .overlay-nav{position:fixed; inset:0; z-index:90; background:rgba(0,0,0,.5); display:none}
  .overlay-nav.open{display:block}
  .drawer{position:absolute; top:0; left:0; bottom:0; width:250px; background:var(--surface); border-right:1px solid var(--border); transform:translateX(-100%); transition:.22s; display:flex; flex-direction:column}
  .overlay-nav.open .drawer{transform:none}
  .kpi .value{font-size:23px}
  .modal-foot{position:sticky;bottom:0;background:var(--surface)}
}
@media(max-width:420px){
  .kpis{grid-template-columns:1fr 1fr}
  .kpi{padding:14px}
  .kpi .value{font-size:20px}
  .kpi .ic{display:none}
}

/* ===== Mobil: tabele-listă devin carduri verticale ===== */
@media(max-width:760px){
  .kpis{grid-template-columns:1fr 1fr}
  .cards-mobile{border:none;background:transparent;overflow:visible;border-radius:0}
  .cards-mobile table{min-width:0;display:block}
  .cards-mobile thead{display:none}
  .cards-mobile tbody{display:block}
  .cards-mobile tbody tr{display:block;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);margin-bottom:10px;padding:2px 14px}
  .cards-mobile tbody tr:hover{background:var(--surface)}
  .cards-mobile td{display:flex;justify-content:space-between;align-items:center;gap:14px;border-bottom:1px solid var(--border);white-space:normal;padding:11px 0;text-align:right;font-size:14px}
  .cards-mobile td:last-child{border-bottom:none}
  .cards-mobile td::before{color:var(--muted);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;text-align:left;white-space:nowrap;flex-shrink:0}
  .cards-mobile .row-actions{justify-content:flex-end;width:100%;gap:10px}
  .cards-mobile .icon-btn{width:40px;height:40px;font-size:17px;background:var(--surface-alt)}
  .cards-mobile .pbar{max-width:130px}
  .cards-mobile .btn-sm{padding:9px 14px;font-size:13.5px}
  .t-students td:nth-of-type(1)::before{content:"Cursant"}
  .t-students td:nth-of-type(2)::before{content:"Curs"}
  .t-students td:nth-of-type(3)::before{content:"Început"}
  .t-students td:nth-of-type(4)::before{content:"Status"}
  .t-students td:nth-of-type(5)::before{content:"Preț"}
  .t-students td:nth-of-type(6)::before{content:"Achitat"}
  .t-students td:nth-of-type(7)::before{content:"Progres plată"}
  .t-payments td:nth-of-type(1)::before{content:"Data"}
  .t-payments td:nth-of-type(2)::before{content:"Cursant"}
  .t-payments td:nth-of-type(3)::before{content:"Curs"}
  .t-payments td:nth-of-type(4)::before{content:"Metodă"}
  .t-payments td:nth-of-type(5)::before{content:"Notă"}
  .t-payments td:nth-of-type(6)::before{content:"Sumă"}
  .t-expenses td:nth-of-type(1)::before{content:"Data"}
  .t-expenses td:nth-of-type(2)::before{content:"Categorie"}
  .t-expenses td:nth-of-type(3)::before{content:"Descriere"}
  .t-expenses td:nth-of-type(4)::before{content:"Sumă"}
  .t-instructors td:nth-of-type(1)::before{content:"Profesor"}
  .t-instructors td:nth-of-type(2)::before{content:"Procent"}
  .t-instructors td:nth-of-type(3)::before{content:"Încasări"}
  .t-instructors td:nth-of-type(4)::before{content:"Salariu"}
  .t-instructors td:nth-of-type(5)::before{content:"Plată"}
}

/* print (rapoarte) */
@media print{
  .sidebar,.topbar,.mobile-nav,.toolbar,.no-print{display:none!important}
  .main{margin:0} .content{padding:0} body{background:#fff;color:#000}
  .card{border-color:#ccc;break-inside:avoid}
}
</style>
</head>
<body>
<div class="app">
  <!-- ===== Sidebar (desktop) ===== -->
  <aside class="sidebar">
    <div class="brand">
      <div class="wordmark"><span class="sel">SELECT</span><span class="aca">ACADEMY</span></div>
      <span class="tag">CRM · Barber</span>
    </div>
    <nav class="nav" id="navDesktop"></nav>
    <div class="nav-footer">
      <div id="dbStamp">—</div>
      <div id="syncStatus" style="margin-top:4px"></div>
      <div style="margin-top:4px">v1.5 · interfață reînnoită</div>
    </div>
  </aside>

  <!-- ===== Main ===== -->
  <div class="main">
    <header class="topbar">
      <button class="hamburger" onclick="toggleDrawer(true)">☰</button>
      <h1 id="pageTitle">Tablou de bord</h1>
      <div id="topbarExtra"></div>
    </header>
    <main class="content" id="view"></main>
  </div>
</div>

<!-- Bottom nav (mobile) -->
<nav class="mobile-nav" id="navMobile"></nav>

<!-- Buton plutitor de adăugare rapidă -->
<button class="fab" id="fab" onclick="quickAdd()" title="Adaugă">＋</button>

<!-- Drawer (mobile full menu) -->
<div class="overlay-nav" id="drawer" onclick="if(event.target===this)toggleDrawer(false)">
  <div class="drawer">
    <div class="brand">
      <div class="wordmark"><span class="sel">SELECT</span><span class="aca">ACADEMY</span></div>
      <span class="tag">CRM · Barber</span>
    </div>
    <nav class="nav" id="navDrawer"></nav>
  </div>
</div>

<!-- Modal + toast -->
<div class="overlay" id="overlay" onclick="if(event.target===this)closeModal()">
  <div class="modal" id="modal"></div>
</div>
<div class="toast" id="toast"></div>

<script>
/* ============================================================
   STORE — persistență localStorage
   ============================================================ */
const KEY='select_academy_crm_v1';
const SYNC_KEY='select_academy_sync_v1';
const CURRENCY='lei';
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);

const DEFAULT_COURSES=[
  {id:'c_zero', name:'Barber de la zero',  type:'Individual', defaultPrice:4500, color:'#E8273A'},
  {id:'c_indiv',name:'Curs individual',    type:'Individual', defaultPrice:3500, color:'#4F9DDE'},
  {id:'c_grup', name:'Curs în grup',       type:'Grup',       defaultPrice:2500, color:'#3FB562'},
  {id:'c_master',name:'Masterclass',       type:'Masterclass',defaultPrice:1200, color:'#B57EDC'},
  {id:'c_perf', name:'Perfecționare',      type:'Perfecționare',defaultPrice:1500,color:'#E0A800'},
];
const EXPENSE_CATS=['Chirie','Materiale & consumabile','Salarii & colaboratori','Marketing & publicitate','Utilități','Echipamente','Taxe & impozite','Altele'];
const PAY_METHODS=['Numerar','Card','Transfer bancar','Online'];

let DB=load();

function blankDB(){
  return {courses:JSON.parse(JSON.stringify(DEFAULT_COURSES)), students:[], payments:[], expenses:[], settings:{academyName:'Select Academy'}, createdAt:Date.now()};
}
function load(){
  try{
    const raw=localStorage.getItem(KEY);
    if(!raw) return blankDB();
    const d=JSON.parse(raw);
    d.courses=d.courses||JSON.parse(JSON.stringify(DEFAULT_COURSES));
    d.students=d.students||[]; d.payments=d.payments||[]; d.expenses=d.expenses||[];

    d.students.forEach(s=>{ const nm=(s.instructor||'').trim(); if(nm && !d.instructors.some(i=>(i.name||'').toLowerCase()===nm.toLowerCase())) d.instructors.push({id:uid(),name:nm,percent:50,phone:'',createdAt:Date.now()}); });
    return d;
  }catch(e){ return blankDB(); }

/* ============================================================
   PERIOADĂ — selector global (afectează Dashboard, Rapoarte)
   ============================================================ */
const now=new Date();
let PERIOD={mode:'month', year:now.getFullYear(), month:now.getMonth(), from:todayISO(), to:todayISO()};

function periodRange(){
  if(PERIOD.mode==='month'){
    const f=new Date(PERIOD.year,PERIOD.month,1);
    const t=new Date(PERIOD.year,PERIOD.month+1,0);
    return [f.toISOString().slice(0,10), t.toISOString().slice(0,10)];
  }
  if(PERIOD.mode==='year'){ return [PERIOD.year+'-01-01', PERIOD.year+'-12-31']; }
  if(PERIOD.mode==='all'){ return ['0000-01-01','9999-12-31']; }
  return [PERIOD.from, PERIOD.to]; // custom
}
function periodLabel(){
  if(PERIOD.mode==='month') return MONTHS_FULL[PERIOD.month]+' '+PERIOD.year;
  if(PERIOD.mode==='year') return 'Anul '+PERIOD.year;
  if(PERIOD.mode==='all') return 'Toată perioada';
  return PERIOD.from+' → '+PERIOD.to;
}
function inRange(dateStr,f,t){ return dateStr>=f && dateStr<=t; }

/* aggregate income/expense/profit + students for a range */
function aggregate(f,t){
  const income=DB.payments.filter(p=>inRange(p.date,f,t)).reduce((a,p)=>a+Number(p.amount||0),0);
  const expense=DB.expenses.filter(e=>inRange(e.date,f,t)).reduce((a,e)=>a+Number(e.amount||0),0);
  const newStudents=DB.students.filter(s=>inRange(s.startDate||'',f,t)).length;
  const activeStudents=DB.students.filter(s=>s.status==='in_curs').length;
  return {income, expense, profit:income-expense, newStudents, activeStudents};
}

function monthlySeries(year){
  const inc=Array(12).fill(0), exp=Array(12).fill(0);
  DB.payments.forEach(p=>{ if(p.date&&+p.date.slice(0,4)===year) inc[+p.date.slice(5,7)-1]+=Number(p.amount||0); });
  DB.expenses.forEach(e=>{ if(e.date&&+e.date.slice(0,4)===year) exp[+e.date.slice(5,7)-1]+=Number(e.amount||0); });
  return {inc,exp};
}
function drawDashboardChart(){
  const el=$('#dashBars'); if(!el) return;
  const year=PERIOD.mode==='year'?PERIOD.year:now.getFullYear();
  const {inc,exp}=monthlySeries(year);
  const max=Math.max(1,...inc,...exp);
  el.innerHTML=MONTHS.map((m,i)=>`
    <div class="bar-col" title="${MONTHS_FULL[i]}: ${fmt(inc[i])} venit / ${fmt(exp[i])} cheltuieli">
      <div class="bar-stack">
        <div class="bar inc" style="height:${Math.round(inc[i]/max*165)}px"></div>
        <div class="bar exp" style="height:${Math.round(exp[i]/max*165)}px"></div>
      </div>
      <div class="lbl">${m}</div>
    </div>`).join('');
}
function donutByCourse(f,t){
  const map={};
  DB.payments.filter(p=>inRange(p.date,f,t)).forEach(p=>{
    const st=studentById(p.studentId); const c=st?courseById(st.courseId):null;
    const key=c?c.id:'alt'; map[key]=(map[key]||0)+Number(p.amount||0);
  });
  const entries=Object.entries(map).map(([id,val])=>{const c=courseById(id);return{name:c?c.name:'Altele',color:c?c.color:'#777',val};}).sort((a,b)=>b.val-a.val);
  const total=entries.reduce((a,e)=>a+e.val,0);
  if(total===0) return `<div class="empty"><div class="big">📭</div>Nicio încasare în perioadă.</div>`;
  let acc=0; const segs=entries.map(e=>{const frac=e.val/total;const s=acc;acc+=frac;return `${e.color} ${(s*100).toFixed(1)}% ${(acc*100).toFixed(1)}%`}).join(',');
  return `<div class="donut-wrap">
    <div style="width:140px;height:140px;border-radius:50%;background:conic-gradient(${segs});display:grid;place-items:center;flex-shrink:0">
      <div style="width:84px;height:84px;border-radius:50%;background:var(--surface);display:grid;place-items:center;text-align:center">
        <div><div style="font-size:11px;color:var(--muted)">Total</div><div style="font-weight:800;font-size:15px">${fmt(total)}</div></div>
      </div>
    </div>
    <div class="donut-legend">${entries.map(e=>`<div class="li"><span class="nm"><i class="dot" style="background:${e.color}"></i>${esc(e.name)}</span><b>${fmt(e.val)}</b></div>`).join('')}</div>
  </div>`;
}
function debtorsList(){
  const debt=DB.students.map(s=>({s,bal:Number(s.price||0)-paidFor(s.id)})).filter(x=>x.bal>0).sort((a,b)=>b.bal-a.bal).slice(0,5);
  if(!debt.length) return '';
  return `<div style="display:flex;flex-direction:column;gap:8px">${debt.map(({s,bal})=>`
    <div style="display:flex;justify-content:space-between;align-items:center;font-size:13.5px;padding:8px 10px;background:var(--surface-alt);border-radius:8px">

function recentActivity(){

    </div>
    <div class="field-row">
      <div class="field"><label>Status</label><select id="f_status">${[['in_curs','În curs'],['finalizat','Finalizat'],['abandonat','Abandonat']].map(([k,l])=>`<option value="${k}" ${s&&s.status===k?'selected':(!s&&k==='in_curs'?'selected':'')}>${l}</option>`).join('')}</select></div>
      <div class="field"><label>Profesor</label><select id="f_instr">${instrOpts}</select><div class="hint" style="margin-top:4px">Adaugi profesori în pagina „Profesori".</div></div>

    <div class="field"><label>Notițe</label><textarea id="f_notes" placeholder="observații, preferințe orar, etc.">${esc(s?s.notes:'')}</textarea></div>
  `,`<button class="btn btn-ghost" onclick="closeModal()">Anulează</button><button class="btn btn-primary" onclick="saveStudent('${id||''}')">${s?'Salvează':'Adaugă cursant'}</button>`);
  setTimeout(()=>$('#f_name')&&$('#f_name').focus(),50);
}
function syncCoursePrice(){
  const sel=$('#f_course'); const opt=sel.options[sel.selectedIndex];
  const p=$('#f_price'); if(p&&!p.value) p.value=opt.dataset.price||'';
}
function saveStudent(id){
  const name=$('#f_name').value.trim();
  if(!name){toast('Numele este obligatoriu','err');return;}
  const courseId=$('#f_course').value;
  const data={
    name, phone:$('#f_phone').value.trim(), email:$('#f_email').value.trim(),
    courseId, price:Number($('#f_price').value||0), startDate:$('#f_start').value||todayISO(),
    status:$('#f_status').value, instructor:$('#f_instr').value.trim(), notes:$('#f_notes').value.trim(),
  };
  if(id){
    const st=studentById(id); const oldStart=st.startDate;
    Object.assign(st,data);
    let moved=0;
    if(oldStart&&data.startDate&&oldStart!==data.startDate){
      DB.payments.forEach(p=>{ if(p.studentId===id&&p.date===oldStart){ p.date=data.startDate; moved++; } });
    }
    toast(moved?`Cursant actualizat · ${moved} ${moved===1?'plată mutată':'plăți mutate'} pe noua dată`:'Cursant actualizat','ok');
  }
  else{
    data.id=uid(); data.createdAt=Date.now(); DB.students.push(data);
    const init=Number($('#f_initpay').value||0);
    if(init>0) DB.payments.push({id:uid(),studentId:data.id,amount:init,date:data.startDate,method:'Numerar',note:'Avans la înscriere',createdAt:Date.now()});
    toast('Cursant adăugat','ok');
  }
  save(); closeModal(); render();
}
function delStudent(id){
  const s=studentById(id); if(!s)return;
  confirmModal(`Ștergi cursantul „${esc(s.name)}”?`,'Se vor șterge și încasările asociate. Acțiunea nu poate fi anulată.',()=>{
    DB.students=DB.students.filter(x=>x.id!==id);
    DB.payments=DB.payments.filter(p=>p.studentId!==id);
    save(); render(); toast('Cursant șters','ok');
  });
}

/* ---------- PAYMENTS ---------- */
function openPaymentModal(studentId,payId){
  const pay=payId?DB.payments.find(p=>p.id===payId):null;
  if(pay) studentId=pay.studentId;
  const s=studentById(studentId);
  const bal=s?Number(s.price||0)-paidFor(s.id):0;
  const studentOpts=DB.students.map(x=>`<option value="${x.id}" ${x.id===studentId?'selected':''}>${esc(x.name)}</option>`).join('');
  modal(pay?'Editează încasare':'Înregistrează încasare',`

    ${s&&bal>0&&!pay?`<div class="hint" style="margin:-6px 0 12px;color:var(--warning)">Rest de plată: <b>${fmt(bal)}</b></div>`:''}
    <div class="field-row">
      <div class="field"><label>Sumă (${CURRENCY}) *</label><input id="p_amount" type="number" min="0" value="${pay?Number(pay.amount||0):(bal>0?bal:'')}" placeholder="0"></div>

    </div>

}
function savePayment(payId){

}
function viewPayments(){
  const list=DB.payments.slice().sort((a,b)=>(b.date||'').localeCompare(a.date||'')||(b.createdAt||0)-(a.createdAt||0));

    <button class="btn btn-primary" onclick="openPaymentModal()" ${DB.students.length?'':'disabled style=opacity:.5'}>＋ Încasare</button>

  <div class="table-wrap cards-mobile t-payments"><table>
    <thead><tr><th>Data</th><th>Cursant</th><th>Curs</th><th>Metodă</th><th>Notă</th><th class="num">Sumă</th><th></th></tr></thead>
    <tbody>${list.map(p=>{const s=studentById(p.studentId);const c=s?courseById(s.courseId):null;return `<tr>
      <td>${esc(p.date)}</td>
      <td><b>${esc(s?s.name:'(șters)')}</b></td>
      <td>${c?`<span class="badge b-gold">${esc(c.name)}</span>`:'—'}</td>
      <td>${esc(p.method||'—')}</td>
      <td><small style="color:var(--muted)">${esc(p.note||'')}</small></td>
      <td class="num" style="color:var(--success);font-weight:700">${fmt(p.amount)}</td>
      <td><div class="row-actions"><button class="icon-btn" title="Editează" onclick="openPaymentModal(null,'${p.id}')">✏️</button><button class="icon-btn danger" title="Șterge" onclick="delPayment('${p.id}')">🗑️</button></div></td>
    </tr>`}).join('')}</tbody>
  </table></div>`}`;

function delPayment(id){

/* ---------- PROFESORI / SALARII ---------- */
let salPeriod={year:now.getFullYear(), month:now.getMonth()};
function instructorById(id){ return DB.instructors.find(i=>i.id===id); }
function salaryMonthKey(){ return `${salPeriod.year}-${String(salPeriod.month+1).padStart(2,'0')}`; }
function instrMonthIncome(instr,year,month){
  const pre=`${year}-${String(month+1).padStart(2,'0')}`; const nm=(instr.name||'').toLowerCase();
  return DB.payments.reduce((a,p)=>{ if(!p.date||p.date.slice(0,7)!==pre) return a; const st=studentById(p.studentId); return (st&&(st.instructor||'').toLowerCase()===nm)?a+Number(p.amount||0):a; },0);
}
function salaryExpenseFor(instrId,ym){ return DB.expenses.find(e=>e.salary&&e.instructorId===instrId&&e.salaryMonth===ym); }
function paySalary(instrId){
  const instr=instructorById(instrId); if(!instr) return;
  const ym=salaryMonthKey();
  if(salaryExpenseFor(instrId,ym)){ toast('Salariul pe luna asta e deja plătit','err'); return; }
  const income=instrMonthIncome(instr,salPeriod.year,salPeriod.month);
  const amount=Math.round(income*Number(instr.percent||0)/100);
  if(amount<=0){ toast('Salariu 0 — nu există încasări sau procent','err'); return; }
  const last=new Date(salPeriod.year,salPeriod.month+1,0);
  const date=`${salPeriod.year}-${String(salPeriod.month+1).padStart(2,'0')}-${String(last.getDate()).padStart(2,'0')}`;
  DB.expenses.push({id:uid(),category:'Salarii & colaboratori',amount,date,description:`Salariu ${instr.name} · ${MONTHS_FULL[salPeriod.month]} ${salPeriod.year} (${Number(instr.percent||0)}% din ${fmt(income)})`,salary:true,instructorId:instrId,instructorName:instr.name,salaryMonth:ym,percent:Number(instr.percent||0),baseIncome:income,createdAt:Date.now()});
  save(); render(); toast(`Salariu ${fmt(amount)} trecut la cheltuieli`,'ok');
}
function unpaySalary(instrId){
  const e=salaryExpenseFor(instrId,salaryMonthKey()); if(!e) return;
  confirmModal('Anulezi plata salariului?','Se șterge cheltuiala cu salariul pe luna aceasta.',()=>{ DB.expenses=DB.expenses.filter(x=>x.id!==e.id); save(); render(); toast('Plată salariu anulată','ok'); });
}
function openInstructorModal(id){
  const i=id?instructorById(id):null;
  modal(i?'Editează profesor':'Profesor nou',`
    <div class="field"><label>Nume *</label><input id="i_name" value="${esc(i?i.name:'')}" placeholder="ex. Daniel Pop"></div>
    <div class="field-row">
      <div class="field"><label>Procent salariu (%) *</label><input id="i_pct" type="number" min="0" max="100" value="${i?Number(i.percent||0):50}"></div>
      <div class="field"><label>Telefon</label><input id="i_phone" value="${esc(i?i.phone:'')}" placeholder="opțional"></div>
    </div>
    <div class="hint">Salariul lunar = procent × încasările aduse de cursanții lui în acea lună.</div>
  `,`<button class="btn btn-ghost" onclick="closeModal()">Anulează</button><button class="btn btn-primary" onclick="saveInstructor('${id||''}')">${i?'Salvează':'Adaugă'}</button>`);
  setTimeout(()=>$('#i_name')&&$('#i_name').focus(),50);
}
function saveInstructor(id){
  const name=$('#i_name').value.trim(); if(!name){toast('Numele e obligatoriu','err');return;}
  const data={name,percent:Number($('#i_pct').value||0),phone:$('#i_phone').value.trim()};
  if(id){ const it=instructorById(id); const oldName=it.name; Object.assign(it,data);
    if(oldName&&oldName.toLowerCase()!==name.toLowerCase()){ DB.students.forEach(s=>{ if((s.instructor||'').toLowerCase()===oldName.toLowerCase()) s.instructor=name; }); }
    toast('Profesor actualizat','ok');
  } else { data.id=uid(); data.createdAt=Date.now(); DB.instructors.push(data); toast('Profesor adăugat','ok'); }
  save(); closeModal(); render();
}
function delInstructor(id){
  const i=instructorById(id); if(!i) return;
  const cnt=DB.students.filter(s=>(s.instructor||'').toLowerCase()===(i.name||'').toLowerCase()).length;
  confirmModal(`Ștergi profesorul „${esc(i.name)}”?`,(cnt?`${cnt} cursant(i) rămân fără profesor. `:'')+'Salariile deja plătite NU se șterg.',()=>{ DB.instructors=DB.instructors.filter(x=>x.id!==id); save(); render(); toast('Profesor șters','ok'); });
}
function viewInstructors(){
  const ym=salaryMonthKey();
  const list=DB.instructors.slice().sort((a,b)=>(a.name||'').localeCompare(b.name||''));
  const yrs=[]; for(let y=now.getFullYear()-3;y<=now.getFullYear()+1;y++) yrs.push(y);
  let totalSal=0, totalPaid=0;
  const rows=list.map(i=>{
    const income=instrMonthIncome(i,salPeriod.year,salPeriod.month);
    const sal=Math.round(income*Number(i.percent||0)/100);
    const paidExp=salaryExpenseFor(i.id,ym);
    totalSal+=sal; if(paidExp) totalPaid+=Number(paidExp.amount||0);
    const studCnt=DB.students.filter(s=>(s.instructor||'').toLowerCase()===(i.name||'').toLowerCase()).length;
    return `<tr>
      <td><b>${esc(i.name)}</b>${i.phone?`<br><small style="color:var(--muted)">${esc(i.phone)}</small>`:''}<br><small style="color:var(--muted)">${studCnt} cursant${studCnt===1?'':'i'}</small></td>
      <td class="num">${Number(i.percent||0)}%</td>
      <td class="num">${fmt(income)}</td>
      <td class="num" style="font-weight:700;color:var(--primary)">${fmt(sal)}</td>
      <td>${paidExp?`<span class="badge b-green">Plătit ✓</span><br><small style="color:var(--muted)">${fmt(paidExp.amount)}</small>`:(sal>0?`<button class="btn btn-primary btn-sm" onclick="paySalary('${i.id}')">💸 Plătește</button>`:'<small style="color:var(--muted)">—</small>')}</td>
      <td><div class="row-actions">
        ${paidExp?`<button class="icon-btn danger" title="Anulează plata" onclick="unpaySalary('${i.id}')">↩️</button>`:''}
        <button class="icon-btn" title="Editează" onclick="openInstructorModal('${i.id}')">✏️</button>
        <button class="icon-btn danger" title="Șterge" onclick="delInstructor('${i.id}')">🗑️</button>
      </div></td>
    </tr>`;
  }).join('');
  return `
  <div class="toolbar">
    <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
      <span style="color:var(--muted);font-size:13px">Luna salariilor:</span>
      <select onchange="salPeriod.month=+this.value;render()">${MONTHS_FULL.map((m,idx)=>`<option value="${idx}" ${idx===salPeriod.month?'selected':''}>${m}</option>`).join('')}</select>
      <select onchange="salPeriod.year=+this.value;render()">${yrs.map(y=>`<option ${y===salPeriod.year?'selected':''}>${y}</option>`).join('')}</select>
    </div>
    <button class="btn btn-primary" onclick="openInstructorModal()">＋ Profesor</button>
  </div>
  ${!list.length?`<div class="card empty"><div class="big">🧑‍🏫</div>Niciun profesor încă.<br><button class="btn btn-primary btn-sm" style="margin-top:12px" onclick="openInstructorModal()">＋ Adaugă primul profesor</button></div>`:`
  <div class="card" style="margin-bottom:14px">
    <div style="color:var(--muted);font-size:13px">Salariul = <b>procent × încasările aduse de cursanții profesorului</b> în luna selectată (<b>${MONTHS_FULL[salPeriod.month]} ${salPeriod.year}</b>). Apasă „💸 Plătește" ca să-l treci automat la Cheltuieli pe luna respectivă.</div>
  </div>
  <div class="table-wrap cards-mobile t-instructors"><table>
    <thead><tr><th>Profesor</th><th class="num">Procent</th><th class="num">Încasări lună</th><th class="num">Salariu</th><th>Plată</th><th></th></tr></thead>
    <tbody>${rows}
      <tr style="border-top:2px solid var(--border)"><td><b>TOTAL</b></td><td></td><td></td><td class="num"><b>${fmt(totalSal)}</b></td><td><small style="color:var(--muted)">plătit: ${fmt(totalPaid)}</small></td><td></td></tr>
    </tbody>
  </table></div>`}`;
}

/* ---------- REPORTS ---------- */
function viewReports(){
  const [f,t]=periodRange();
  const a=aggregate(f,t);
  const margin=a.income>0?Math.round(a.profit/a.income*100):0;
  // expense breakdown
  const byCat={}; DB.expenses.filter(e=>inRange(e.date,f,t)).forEach(e=>byCat[e.category]=(byCat[e.category]||0)+Number(e.amount||0));
  const catRows=Object.entries(byCat).sort((a,b)=>b[1]-a[1]);
  // income by course
  const byCourse={}; DB.payments.filter(p=>inRange(p.date,f,t)).forEach(p=>{const s=studentById(p.studentId);const c=s?courseById(s.courseId):null;const k=c?c.name:'Altele';byCourse[k]=(byCourse[k]||0)+Number(p.amount||0);});
  const courseRows=Object.entries(byCourse).sort((a,b)=>b[1]-a[1]);
  // monthly table for year mode
  const year=PERIOD.mode==='year'?PERIOD.year:(PERIOD.mode==='month'?PERIOD.year:now.getFullYear());
  const {inc,exp}=monthlySeries(year);

  return `
  <div class="toolbar no-print">
    <div style="flex:1;color:var(--muted);font-size:13.5px">Perioadă analizată: <b style="color:var(--text)">${periodLabel()}</b></div>
    <button class="btn btn-ghost" onclick="window.print()">🖨️ Printează / PDF</button>
    <button class="btn btn-ghost" onclick="exportCSV()">⬇️ Export CSV</button>
  </div>

  <div class="grid kpis">
    <div class="card kpi green"><div class="label">Venituri totale</div><div class="value">${fmt(a.income)}</div></div>
    <div class="card kpi red"><div class="label">Cheltuieli totale</div><div class="value">${fmt(a.expense)}</div></div>
    <div class="card kpi ${a.profit>=0?'gold':'red'}"><div class="label">Profit net</div><div class="value">${fmt(a.profit)}</div><div class="sub">Marjă de profit ${margin}%</div></div>
    <div class="card kpi blue"><div class="label">Cursanți noi</div><div class="value">${a.newStudents}</div></div>
  </div>

  <div class="grid row2" style="margin-top:6px">
    <div class="card">
      <div class="section-title" style="margin-top:0">💰 Venituri pe tip de curs</div>
      ${courseRows.length?`<div class="table-wrap" style="border:none"><table style="min-width:auto"><tbody>
        ${courseRows.map(([n,v])=>`<tr><td>${esc(n)}</td><td class="num"><b style="color:var(--success)">${fmt(v)}</b></td><td class="num" style="color:var(--muted)">${a.income?Math.round(v/a.income*100):0}%</td></tr>`).join('')}
        <tr style="border-top:2px solid var(--border)"><td><b>Total</b></td><td class="num"><b>${fmt(a.income)}</b></td><td></td></tr>
      </tbody></table></div>`:'<div class="empty">—</div>'}

function download(name,content,type){
  const b=new Blob([content],{type}); const u=URL.createObjectURL(b);
  const a=document.createElement('a'); a.href=u; a.download=name; a.click(); URL.revokeObjectURL(u);
}
function exportJSON(){ download(`select-academy-backup-${todayISO()}.json`,JSON.stringify(DB,null,2),'application/json'); toast('Backup descărcat','ok'); }
function importJSON(ev){
  const file=ev.target.files[0]; if(!file)return;
  const r=new FileReader();
  r.onload=()=>{ try{ const d=JSON.parse(r.result);
    if(!d.students||!d.courses) throw 0;
    confirmModal('Importă backup?','Datele curente vor fi înlocuite cu cele din fișier.',()=>{ DB=d; save(); render(); toast('Backup importat','ok'); });
  }catch(e){ toast('Fișier invalid','err'); } };
  r.readAsText(file); ev.target.value='';
}

/* ============================================================
   SINCRONIZARE ONLINE (criptată) — între dispozitive
   Stocare: un Gist secret în contul GitHub al utilizatorului
   (api.github.com acceptă CORS din browser). Datele se
   criptează AES-GCM cu o parolă înainte de a pleca de pe device.
   ============================================================ */
const GH_API='https://api.github.com';
const GIST_FILE='select-academy-crm-sync.json';
function _ghH(token,withBody){ const h={'Authorization':'Bearer '+token,'Accept':'application/vnd.github+json'}; if(withBody) h['Content-Type']='application/json'; return h; }
function _b64(u8){let s='';for(let i=0;i<u8.length;i++)s+=String.fromCharCode(u8[i]);return btoa(s);}
function _ub64(str){const s=atob(str);const u8=new Uint8Array(s.length);for(let i=0;i<s.length;i++)u8[i]=s.charCodeAt(i);return u8;}
async function _deriveKey(pass,salt){
  const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pass),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:100000,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);
}
async function _encrypt(obj,pass){
  const salt=crypto.getRandomValues(new Uint8Array(16)), iv=crypto.getRandomValues(new Uint8Array(12));
  const key=await _deriveKey(pass,salt);
  const ct=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv},key,new TextEncoder().encode(JSON.stringify(obj))));
  return {s:_b64(salt),iv:_b64(iv),ct:_b64(ct)};
}
async function _decrypt(enc,pass){
  const key=await _deriveKey(pass,_ub64(enc.s));
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:_ub64(enc.iv)},key,_ub64(enc.ct));
  return JSON.parse(new TextDecoder().decode(pt));
}
async function _ghFind(token){
  const r=await fetch(GH_API+'/gists?per_page=100',{headers:_ghH(token)});
  if(!r.ok) throw new Error('Token invalid sau fără acces (cod '+r.status+')');
  const arr=await r.json();
  const g=arr.find(x=>x.files&&x.files[GIST_FILE]);
  return g?g.id:null;
}
async function _ghGet(token,id){
  const r=await fetch(GH_API+'/gists/'+id,{headers:_ghH(token)});
  if(!r.ok) throw new Error('Nu pot citi din cloud (cod '+r.status+')');
  const j=await r.json(); const f=j.files&&j.files[GIST_FILE];
  if(!f) throw new Error('Fișierul de sincronizare lipsește');
  let c=f.content; if(f.truncated&&f.raw_url){ const rr=await fetch(f.raw_url); c=await rr.text(); }
  return JSON.parse(c);
}
async function _ghCreate(token,payload){
  const r=await fetch(GH_API+'/gists',{method:'POST',headers:_ghH(token,true),body:JSON.stringify({description:'Select Academy CRM — sincronizare (nu șterge)',public:false,files:{[GIST_FILE]:{content:JSON.stringify(payload)}}})});
  if(!r.ok) throw new Error('Nu pot crea spațiul în cloud (cod '+r.status+')');
  const j=await r.json(); return j.id;
}
async function _ghUpdate(token,id,payload){
  const r=await fetch(GH_API+'/gists/'+id,{method:'PATCH',headers:_ghH(token,true),body:JSON.stringify({files:{[GIST_FILE]:{content:JSON.stringify(payload)}}})});
  if(!r.ok) throw new Error('Nu pot salva în cloud (cod '+r.status+')');
}
const Sync={
  cfg:null, busy:false, _t:null,
  load(){ try{this.cfg=JSON.parse(localStorage.getItem(SYNC_KEY)||'null');}catch(e){this.cfg=null;} },
  saveCfg(){ localStorage.setItem(SYNC_KEY,JSON.stringify(this.cfg)); },
  on(){ return !!(this.cfg&&this.cfg.token&&this.cfg.gistId); },
  setStatus(s,cls){ const el=document.getElementById('syncStatus'); if(el){ el.textContent=s?('☁️ '+s):''; el.style.color=cls==='err'?'var(--danger)':cls==='ok'?'var(--success)':'var(--muted)'; } },
  async connect(token,pass){
    let id=await _ghFind(token);
    if(!id){
      id=await _ghCreate(token,{updatedAt:DB.updatedAt||Date.now(),enc:await _encrypt(DB,pass)});
      this.cfg={token,pass,gistId:id,lastSync:Date.now()}; this.saveCfg();
    } else {
      const payload=await _ghGet(token,id);
      let remote; try{ remote=await _decrypt(payload.enc,pass); }catch(e){ throw new Error('Parolă greșită pentru datele din cloud'); }
      this.cfg={token,pass,gistId:id,lastSync:Date.now()}; this.saveCfg();
      DB=remote; localStorage.setItem(KEY,JSON.stringify(DB)); renderStamp(); render();
    }
    this.setStatus('Sincronizat','ok');
  },
  async push(){
    if(!this.on()||this.busy) return; this.busy=true; this.setStatus('Se salvează…');
    try{ await _ghUpdate(this.cfg.token,this.cfg.gistId,{updatedAt:DB.updatedAt||Date.now(),enc:await _encrypt(DB,this.cfg.pass)});
      this.cfg.lastSync=Date.now(); this.saveCfg(); this.setStatus('Sincronizat','ok');
    }catch(e){ this.setStatus('Offline — salvat local','err'); }
    this.busy=false;
  },
  async pull(){
    if(!this.on()) return; if(document.getElementById('overlay').classList.contains('open')) return;
    try{ const payload=await _ghGet(this.cfg.token,this.cfg.gistId);
      if(payload&&payload.updatedAt&&payload.updatedAt>(DB.updatedAt||0)){
        const remote=await _decrypt(payload.enc,this.cfg.pass);
        DB=remote; localStorage.setItem(KEY,JSON.stringify(DB)); renderStamp(); render(); this.setStatus('Sincronizat','ok');
      }
    }catch(e){ /* rămâne pe datele locale */ }
  },
  schedulePush(){ if(!this.on())return; clearTimeout(this._t); this._t=setTimeout(()=>this.push(),1500); },
  disconnect(){ this.cfg=null; localStorage.removeItem(SYNC_KEY); this.setStatus(''); render(); toast('Sincronizare oprită pe acest dispozitiv','ok'); },
  async init(){ this.load(); if(this.on()){ this.setStatus('Se conectează…'); await this.pull(); await this.push(); } }
};
window.Sync=Sync;

async function doSyncConnect(){
  const t=$('#gh_t').value.trim(), p=$('#gh_p').value;
  if(!t||!p){toast('Completează tokenul și parola','err');return;}
  if(p.length<4){toast('Parola: minim 4 caractere','err');return;}
  const g=$('#gh_go'); g.textContent='Se conectează…'; g.disabled=true;
  try{ await Sync.connect(t,p); closeModal(); toast('✅ Conectat! Sincronizare activă','ok'); render(); }
  catch(e){ toast(e&&e.message?e.message:'Eroare la conectare','err'); const b=$('#gh_go'); if(b){b.textContent='Conectează';b.disabled=false;} }
}
function syncDisconnect(){ confirmModal('Oprești sincronizarea pe acest dispozitiv?','Datele rămân salvate local aici. Celelalte dispozitive continuă sincronizarea.',()=>Sync.disconnect()); }
async function syncTest(){
  modal('🔧 Test sincronizare','<pre id="sytest" style="white-space:pre-wrap;font-size:13px;line-height:1.6;color:var(--text);margin:0">Se testează conexiunea…</pre>','<button class="btn btn-primary" onclick="closeModal()">Închide</button>');
  const log=[]; const upd=()=>{ const el=document.getElementById('sytest'); if(el) el.textContent=log.join('\n'); };
  try{
    log.push('⏳ Verific accesul la GitHub din acest browser…'); upd();
    const r=await fetch(GH_API+'/rate_limit',{headers:{'Accept':'application/vnd.github+json'}});
    if(!r.ok) throw new Error('răspuns '+r.status);
    log.push('✅ GitHub accesibil din browser (CORS OK).'); upd();
    if(Sync.on()){
      const lr=await fetch(GH_API+'/gists/'+Sync.cfg.gistId,{headers:_ghH(Sync.cfg.token)});
      log.push(lr.ok?'✅ Token valid, spațiul de sincronizare e accesibil.':'❌ Problemă cu tokenul (cod '+lr.status+').'); upd();
      log.push(''); log.push(lr.ok?'🎉 SINCRONIZAREA FUNCȚIONEAZĂ pe acest dispozitiv!':'Reconectează-te cu un token nou (scope: gist).');
    } else {
      log.push(''); log.push('🎉 Conexiunea merge! Acum apasă „Conectează sincronizarea" și introdu tokenul.');
    }
    upd();
  }catch(e){
    log.push(''); log.push('❌ EROARE: '+(e&&e.message?e.message:e)); log.push('');
    log.push('GitHub nu e accesibil din acest browser (rețea/firewall).');
    log.push('Trimite-i această captură dezvoltatorului.');
    upd();
  }
}

/* ============================================================
   INIT
   ============================================================ */
buildNav(); renderStamp(); Sync.load(); render();
Sync.init();
window.addEventListener('focus',()=>Sync.pull());
document.addEventListener('visibilitychange',()=>{ if(!document.hidden) Sync.pull(); });
</script>
