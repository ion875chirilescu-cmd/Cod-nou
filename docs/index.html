  },
  async claimOwner(){
    const t=($('#cl_t').value||'').trim(), p=$('#cl_p').value||'', who=($('#cl_u').value||'').trim();
    if(!t||!p||!who) return this.err('Completează toate câmpurile.');
    this.err('Se conectează la cloud…');
    try{
      await Sync.connect(t,p,true);   // descarcă conturile + datele
      this.load();
      const u=this.find(who);
      if(!u){ this.err('Nu există contul „'+who+'". Verifică numele exact.'); return; }
      u.role='proprietar'; this.cfg.authUpdatedAt=Date.now(); this.saveCfg();
      try{ await _syncPushNow(); }catch(e){}   // urcă rolul în cloud ca să rămână permanent
      DB=buildDemoDB(); this.screen='login'; this.show(); this.err('');
      toast('„'+who+'" este acum Proprietar. Autentifică-te.','ok');
      setTimeout(()=>{ const el=$('#au_user'); if(el) el.value=who; },80);
    }catch(e){ this.err(e&&e.message?e.message:'Eroare la revendicare'); }
  },
  htmlRecover(){
    return `<div class="auth-card">
      <div class="wordmark"><span class="sel">SELECT</span> <span class="aca">ACADEMY</span></div>
      <h2>🔑 Recuperare cont</h2>
      <div class="sub">Ai uitat parola? Folosește <b>tokenul GitHub + parola de sincronizare</b> ca să resetezi parola oricărui cont.</div>
      <div class="auth-err" id="au_err"></div>
      <div class="field"><label>Token GitHub</label><input id="rc_t" type="password" placeholder="ghp_..."></div>
      <div class="field"><label>Parolă de sincronizare</label><input id="rc_p" type="password" placeholder="parola de criptare a datelor"></div>
      <button class="btn btn-primary" onclick="Auth.recoverConnect()">Continuă</button>
      <div class="auth-switch" style="margin-top:14px"><a onclick="Auth.go('login')">← Înapoi la autentificare</a></div>
    </div>`;
  },
  async recoverConnect(){
    const t=($('#rc_t').value||'').trim(), p=$('#rc_p').value||'';
    if(!t||!p) return this.err('Completează tokenul și parola de sincronizare.');
    this.err('Se conectează la cloud…');
    try{
      await Sync.connect(t,p,true);   // descarcă conturile + datele din spațiul sincronizat
      this.load();
      if(!this.has()){ this.err('Spațiul nu conține conturi.'); return; }
      this.screen='recoverPick'; this.show(); this.err('');
    }catch(e){ this.err(e&&e.message?e.message:'Eroare la conectare'); }
  },
  htmlRecoverPick(){
    const rows=this.cfg.users.map(u=>`<button class="btn btn-ghost" style="width:100%;justify-content:space-between;margin-bottom:8px" onclick="Auth.recoverPickModal('${esc(u.user).replace(/'/g,'')}')"><span>👤 ${esc(u.user)}</span><span style="color:var(--muted);font-size:12px">${ROLE_LABEL[u.role||'proprietar']}</span></button>`).join('');
    return `<div class="auth-card">
      <div class="wordmark"><span class="sel">SELECT</span> <span class="aca">ACADEMY</span></div>
      <h2>Alege contul de recuperat</h2>
      <div class="sub">Apasă contul pentru care vrei să <b>setezi o parolă nouă</b>.</div>
      <div class="auth-err" id="au_err"></div>
      <div style="margin:6px 0 4px">${rows||'<div style="color:var(--muted)">Niciun cont.</div>'}</div>
      <div class="auth-switch" style="margin-top:10px"><a onclick="Auth.go('recover')">← Înapoi</a></div>
    </div>`;
  },
  recoverPickModal(name){
    this._recoverName=name;
    modal('Resetează parola · '+esc(name),`
      <div class="field"><label>Parolă nouă *</label><input id="rp_new" type="password" placeholder="minim 4 caractere"></div>
      <div class="field"><label>Confirmă parola nouă *</label><input id="rp_new2" type="password" placeholder="repetă parola"></div>
    `,`<button class="btn btn-ghost" onclick="closeModal()">Anulează</button><button class="btn btn-primary" onclick="Auth.recoverApply()">Salvează</button>`);
  },
  async recoverApply(){
    const name=this._recoverName; const u=this.find(name); if(!u) return toast('Cont inexistent','err');
    const np=$('#rp_new').value||'', np2=$('#rp_new2').value||'';
    if(np.length<4) return toast('Parola: minim 4 caractere','err');
    if(np!==np2) return toast('Parolele nu coincid','err');
    const salt=crypto.getRandomValues(new Uint8Array(16));
    u.salt=_b64(salt); u.hash=await _authHash(np,salt);
    this.cfg.authUpdatedAt=Date.now(); this.saveCfg();
    try{ await _syncPushNow(); }catch(e){}   // urcă în cloud ca să rămână permanent
    closeModal();
    this.screen='login'; this.show(); toast('Parolă resetată pentru „'+name+'". Autentifică-te.','ok');
    setTimeout(()=>{ const el=$('#au_user'); if(el) el.value=name; },80);
  },
  err(m){ const e=$('#au_err'); if(e) e.textContent=m||''; },
  async register(){
    const user=($('#au_user').value||'').trim(), pass=$('#au_pass').value||'', pass2=$('#au_pass2').value||'';
    if(user.length<2) return this.err('Numele trebuie să aibă cel puțin 2 caractere.');
    if(this.find(user)) return this.err('Există deja un cont cu acest nume.');
    if(pass.length<4) return this.err('Parola trebuie să aibă cel puțin 4 caractere.');
    if(pass!==pass2) return this.err('Parolele nu coincid.');
    const role=this.has()?'angajat':'proprietar'; // primul cont = proprietar (drepturi depline)
    const salt=crypto.getRandomValues(new Uint8Array(16));
    this.cfg.users.push({user,role,salt:_b64(salt),hash:await _authHash(pass,salt),createdAt:Date.now()});
    this.cfg.authUpdatedAt=Date.now(); this.saveCfg(); localStorage.setItem(SESS_KEY,user);
    PREVIEW=false; DB=load(); this.hide(); route=this.landing(); buildNav(); render(); updateUserLine(); startIdleTimer(); this._push(); toast('Cont creat. Bun venit, '+user+'!','ok');
  },
  async login(){
    const user=($('#au_user').value||'').trim(), pass=$('#au_pass').value||'';
    const u=this.find(user); if(!u) return this.err('Utilizator inexistent.');
    if(await _authHash(pass,_ub64(u.salt))!==u.hash) return this.err('Parolă greșită.');
    localStorage.setItem(SESS_KEY,u.user);
    PREVIEW=false; DB=load(); this.hide(); route=this.landing(); buildNav(); render(); updateUserLine(); startIdleTimer(); toast('Bun venit, '+u.user+'!','ok');
    if(window.Sync) Sync.pull();
  },
  logout(reason){ localStorage.removeItem(SESS_KEY); stopIdleTimer(); PREVIEW=true; DB=buildDemoDB(); this.screen=this.has()?'login':'register'; buildNav(); render(); this.show(); updateUserLine(); toast(reason||'Te-ai deconectat','ok'); },
  addAccountModal(){ if(!this.isOwner()) return; const instrOpts=DB.instructors.map(i=>`<option value="${i.id}">${esc(i.name)}</option>`).join(''); modal('Adaugă cont nou',`
      <div class="field"><label>Utilizator *</label><input id="na_user" placeholder="nume utilizator"></div>
      <div class="field"><label>Parolă *</label><input id="na_pass" type="password" placeholder="minim 4 caractere"></div>
      <div class="field"><label>Rol</label><select id="na_role" onchange="document.getElementById('na_instr_wrap').style.display=this.value==='angajat'?'block':'none'">
        <option value="angajat">Angajat / Profesor (vede doar zona lui)</option>
        <option value="administrator">Administrator (vede tot + adaugă)</option>
        <option value="proprietar">Proprietar (drepturi depline)</option>
      </select></div>
      <div class="field" id="na_instr_wrap"><label>Profesor asociat (pentru angajat)</label><select id="na_instr"><option value="">— niciunul —</option>${instrOpts}</select></div>
      <div class="hint"><b>Angajat/Profesor:</b> vede doar cursanții lui și salariul lui pe lună. <b>Administrator:</b> vede tot și poate adăuga date, dar nu poate șterge. <b>Proprietar:</b> control total.</div>
    `,`<button class="btn btn-ghost" onclick="closeModal()">Anulează</button><button class="btn btn-primary" onclick="Auth.addAccount()">Creează cont</button>`); },
  async addAccount(){
    if(!this.isOwner()) return;
    const user=($('#na_user').value||'').trim(), pass=$('#na_pass').value||'', role=$('#na_role').value||'angajat';
    if(user.length<2) return toast('Nume prea scurt','err');
    if(this.find(user)) return toast('Numele există deja','err');
    if(pass.length<4) return toast('Parolă prea scurtă (min 4)','err');
    const salt=crypto.getRandomValues(new Uint8Array(16));
    const rec={user,role,salt:_b64(salt),hash:await _authHash(pass,salt),createdAt:Date.now()};
    if(role==='angajat'){ const iid=$('#na_instr')?$('#na_instr').value:''; if(iid){ const ins=instructorById(iid); rec.instructorId=iid; rec.instructorName=ins?ins.name:''; } }
    this.cfg.users.push(rec);
    this.commit(); closeModal(); render(); toast('Cont „'+user+'" creat ('+ROLE_LABEL[role]+')','ok');
  },
  setRole(name,role){
    if(!this.isOwner()) return;
    const u=this.find(name); if(!u) return;
    const owners=this.cfg.users.filter(x=>(x.role||'proprietar')==='proprietar');
    if((u.role||'proprietar')==='proprietar' && role!=='proprietar' && owners.length<=1) return toast('Trebuie să rămână cel puțin un proprietar','err');
    u.role=role; if(role!=='angajat'){ delete u.instructorId; delete u.instructorName; } this.commit();
    const cur=this.current();
    if(cur&&cur.user===u.user){ buildNav(); route=this.can(route)?route:this.landing(); }
    render(); toast('Rol actualizat: '+u.user+' → '+ROLE_LABEL[role],'ok');
  },
  setInstructor(name,iid){
    if(!this.isOwner()) return;
    const u=this.find(name); if(!u) return;
    if(iid){ const ins=instructorById(iid); u.instructorId=iid; u.instructorName=ins?ins.name:''; }
    else { delete u.instructorId; delete u.instructorName; }
    this.commit(); render(); toast('Profesor asociat actualizat','ok');
  },
  saveRow(idx){
    if(!this.isOwner()) return toast('Doar proprietarul poate schimba roluri','err');
    const u=this.cfg.users[idx]; if(!u) return;
    const rs=document.getElementById('role_'+idx); const role=rs?rs.value:(u.role||'proprietar');
    const owners=this.cfg.users.filter(x=>(x.role||'proprietar')==='proprietar');
    if((u.role||'proprietar')==='proprietar' && role!=='proprietar' && owners.length<=1) return toast('Trebuie să rămână cel puțin un proprietar','err');
    u.role=role;
    if(role==='angajat'){ const is=document.getElementById('instr_'+idx); const iid=is?is.value:''; if(iid){ const ins=instructorById(iid); u.instructorId=iid; u.instructorName=ins?ins.name:''; } else { delete u.instructorId; delete u.instructorName; } }
    else { delete u.instructorId; delete u.instructorName; }
    this.commit();
    const cur=this.current(); if(cur&&cur.user===u.user){ buildNav(); route=this.can(route)?route:this.landing(); }
    render(); toast('✅ Salvat: '+u.user+' → '+ROLE_LABEL[role],'ok');
  },
  changePasswordModal(){ modal('Schimbă parola',`
      <div class="field"><label>Parola actuală</label><input id="cp_cur" type="password"></div>
      <div class="field"><label>Parola nouă</label><input id="cp_new" type="password"></div>
      <div class="field"><label>Confirmă parola nouă</label><input id="cp_new2" type="password"></div>
    `,`<button class="btn btn-ghost" onclick="closeModal()">Anulează</button><button class="btn btn-primary" onclick="Auth.changePassword()">Salvează</button>`); },
  async changePassword(){
    const u=this.current(); if(!u) return;
    const cur=$('#cp_cur').value||'', np=$('#cp_new').value||'', np2=$('#cp_new2').value||'';
    if(await _authHash(cur,_ub64(u.salt))!==u.hash) return toast('Parola actuală e greșită','err');
    if(np.length<4) return toast('Parola nouă: minim 4 caractere','err');
    if(np!==np2) return toast('Parolele nu coincid','err');
    const salt=crypto.getRandomValues(new Uint8Array(16));
    u.salt=_b64(salt); u.hash=await _authHash(np,salt); this.commit();
    closeModal(); toast('Parolă schimbată','ok');
  },
  delAccount(name){
    if(!this.isOwner()) return toast('Doar proprietarul poate șterge conturi','err');
    if(this.cfg.users.length<=1) return toast('Nu poți șterge ultimul cont','err');
    const tgt=this.find(name); if(!tgt) return;
    const owners=this.cfg.users.filter(x=>(x.role||'proprietar')==='proprietar');
    if((tgt.role||'proprietar')==='proprietar' && owners.length<=1) return toast('Trebuie să rămână cel puțin un proprietar','err');
    const cur=this.current();
    confirmModal('Ștergi contul „'+name+'"?','Contul nu va mai putea fi folosit pentru autentificare.',()=>{
      this.cfg.users=this.cfg.users.filter(u=>u.user!==name); this.commit();
      if(cur&&cur.user===name){ localStorage.removeItem(SESS_KEY); this.boot(); } else { render(); }
      toast('Cont șters','ok');
    });
  }
};
function updateUserLine(){
  const u=Auth.current();
  const roleL=u?(ROLE_LABEL[u.role||'proprietar']||'Proprietar'):'';
  const html=u?`👤 <b>${esc(u.user)}</b> <small style="opacity:.8">· ${roleL}</small> <a onclick="Auth.logout()">Ieși</a>`:'';
  document.querySelectorAll('.user-line').forEach(el=>el.innerHTML=html);
}

/* Deconectare automată după inactivitate (10 minute) */
const IDLE_MS=10*60*1000;
let _idleTimer=null;
function resetIdleTimer(){
  if(!Auth.authed()) return;
  clearTimeout(_idleTimer);
  _idleTimer=setTimeout(()=>{ if(Auth.authed()) Auth.logout('Deconectat automat după 10 min de inactivitate'); }, IDLE_MS);
}
function startIdleTimer(){ resetIdleTimer(); }
function stopIdleTimer(){ clearTimeout(_idleTimer); _idleTimer=null; }
['click','keydown','mousemove','touchstart','scroll'].forEach(ev=>
  document.addEventListener(ev,()=>{ if(_idleTimer!==null||Auth.authed()) resetIdleTimer(); },{passive:true}));

/* Conectare automată a unui dispozitiv nou printr-un link (#pair=...) generat de proprietar */
async function tryPairFromHash(){
  const m=(location.hash||'').match(/pair=([^&]+)/);
  if(!m) return false;
  try{
    const cfg=JSON.parse(decodeURIComponent(escape(atob(decodeURIComponent(m[1])))));
    history.replaceState(null,'',location.pathname+location.search); // curăță linkul imediat
    if(cfg&&cfg.t&&cfg.p){
      Auth.load();
      await Sync.connect(cfg.t,cfg.p,true); // descarcă conturile + datele
      toast('Dispozitiv conectat ✓ Autentifică-te.','ok');
      return true;
    }
  }catch(e){ history.replaceState(null,'',location.pathname+location.search); toast('Link de conectare invalid','err'); }
  return false;
}

/* ============================================================
   PWA — service worker + instalare pe ecranul principal
   ============================================================ */
let _installPrompt=null;
if('serviceWorker' in navigator){ window.addEventListener('load',()=>{ navigator.serviceWorker.register('sw.js').catch(()=>{}); }); }
window.addEventListener('beforeinstallprompt',e=>{ e.preventDefault(); _installPrompt=e; });
function isStandalone(){ return (window.matchMedia&&window.matchMedia('(display-mode: standalone)').matches) || window.navigator.standalone===true; }
async function installApp(){
  if(_installPrompt){ _installPrompt.prompt(); try{ await _installPrompt.userChoice; }catch(e){} _installPrompt=null; return; }
  if(isStandalone()){ toast('Aplicația e deja instalată ✓','ok'); return; }
  const iOS=/iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
  modal('📲 Instalează aplicația', iOS?`
    <p style="color:var(--muted);font-size:13.5px;line-height:1.7;margin-bottom:6px">Pe iPhone / iPad (în <b>Safari</b>):</p>
    <ol style="color:var(--muted);font-size:13.5px;line-height:1.95;margin:0 0 0 18px;padding:0">
      <li>Apasă butonul <b>Partajează</b> (pătratul cu săgeată ⬆️, jos).</li>
      <li>Derulează și alege <b>„Adaugă pe ecranul de pornire"</b>.</li>
      <li>Apasă <b>Adaugă</b> → apare iconița ca o aplicație.</li>
    </ol>`:`
    <p style="color:var(--muted);font-size:13.5px;line-height:1.7;margin-bottom:6px">Pe Android (în <b>Chrome</b>):</p>
    <ol style="color:var(--muted);font-size:13.5px;line-height:1.95;margin:0 0 0 18px;padding:0">
      <li>Apasă meniul <b>⋮</b> (sus dreapta).</li>
      <li>Alege <b>„Instalează aplicația"</b> (sau „Adaugă pe ecranul principal").</li>
      <li>Confirmă → apare iconița ca o aplicație.</li>
    </ol>`,
  `<button class="btn btn-primary" onclick="closeModal()">Am înțeles</button>`);
}

/* ============================================================
   INIT
   ============================================================ */
(async function(){
  Auth.load(); Sync.load();
  renderStamp();
  Auth.boot();   // afișează imediat ecranul (login/creare) cu demo în spate
  try{ const paired=await tryPairFromHash(); if(paired){ DB=buildDemoDB(); Auth.boot(); } }catch(e){}
  Sync.init();
})();
window.addEventListener('focus',()=>Sync.pull());
document.addEventListener('visibilitychange',()=>{ if(!document.hidden) Sync.pull(); });
</script>
